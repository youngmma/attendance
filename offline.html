<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>오프라인 — 순장반 얼굴인식 출석</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0d1117; color:#e8ebf0; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .box { text-align:center; padding:32px; max-width:340px; }
  .box h1 { font-size:20px; margin:0 0 12px; color:#fff; }
  .box p { font-size:15px; line-height:1.6; color:#8a94a1; margin:0 0 20px; }
  button { background:#1f3a5f; color:#fff; border:0; border-radius:12px;
           font-size:16px; padding:12px 28px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>인터넷 연결이 필요해요</h1>
  <p>출석 앱을 처음 실행할 때는 인터넷이 연결되어 있어야 합니다.<br>연결 후 아래 버튼을 눌러 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
